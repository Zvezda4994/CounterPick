[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cs2-pickem"
version = "0.1.0"
description = "CS2 Major Pick'Em optimizer: maximize P(>=5 correct picks) per Swiss stage."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.scripts]
pickem-optimize = "pickem.optimizer.cli:main"

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.6",
    "pandas-stubs>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pickem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = [
    "slow: large Monte Carlo runs, skipped by default (run with -m slow)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD", "RUF"]
